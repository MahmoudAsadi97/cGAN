name: Tests and released-data smoke run
on:
  push:
    branches: [main, research/fluvius-cgan]
    paths: ['src/**', 'tests/**', 'configs/**', 'scripts/run_experiments.py', 'pyproject.toml', '.github/workflows/tests.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test environment
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - run: python -m pytest -q
  released-data-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU environment
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Prepare real release subset
        run: |
          python -m energy_cgan fetch-data --output data/raw.zip
          python -m energy_cgan prepare --archive data/raw.zip --config configs/data_smoke.json --output data/smoke
      - name: Train and evaluate the validation subset
        run: |
          python -m energy_cgan train --data data/smoke --config configs/smoke.json --output runs/smoke
          python -m energy_cgan evaluate --data data/smoke --checkpoint runs/smoke/best.pt --split val --max-per-condition 20 --output runs/smoke/validation.json
      - name: Store reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-data-smoke-evidence
          path: |
            data/smoke/metadata.json
            runs/smoke/
          retention-days: 30
