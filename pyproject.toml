[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fluvius-cgan"
version = "0.3.0"
description = "Reference conditional GAN validation on Fluvius residential electricity profiles"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "scipy>=1.15,<2",
  "torch>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "build>=1.3,<2"]
plots = ["matplotlib>=3.10,<4"]

[project.scripts]
fluvius-cgan = "fluvius_cgan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
