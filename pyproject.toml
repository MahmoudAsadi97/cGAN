[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-cgan"
version = "0.1.0"
description = "Reproducible conditional GAN experiments on Fluvius electricity profiles"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<4", "scipy>=1.11,<2", "torch>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
energy-cgan = "energy_cgan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
