[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluvius-cgan"
version = "0.2.0"
description = "Reproducible conditional GAN research for Fluvius electricity profiles"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<4", "scipy>=1.10,<2", "torch>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "openpyxl>=3.1,<4"]

[project.scripts]
fluvius-cgan = "fluvius_cgan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
